<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocMind — RAG Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #7c6af7;
      --accent-dim: rgba(124,106,247,0.12);
      --text: #e8e8e8;
      --muted: #666;
      --user-bubble: #1e1e2e;
      --bot-bubble: #161622;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: grid;
      grid-template-columns: 300px 1fr;
    }

    /* Sidebar */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      gap: 20px;
    }
    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--text); }
    .sidebar-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-weight: 600;
    }
    .upload-area {
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }
    .upload-area:hover { border-color: var(--accent); background: var(--accent-dim); }
    .upload-area.dragover { border-color: var(--accent); background: var(--accent-dim); }
    .upload-icon { font-size: 28px; margin-bottom: 8px; }
    .upload-area p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .upload-area strong { color: var(--text); }
    #file-input { display: none; }

    .doc-list { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
    .doc-item {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .doc-item .dot {
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .clear-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* Main Chat */
    .main {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .chat-header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .chat-header h1 { font-size: 16px; font-weight: 600; }
    .chat-header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 12px; max-width: 80%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--accent); }
    .msg.bot .avatar { background: var(--surface); border: 1px solid var(--border); }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--accent);
      border-top-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state .icon { font-size: 48px; }
    .empty-state p { font-size: 14px; max-width: 280px; line-height: 1.6; }

    .input-area {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }
    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      width: 48px;
      height: 48px;
      cursor: pointer;
      font-size: 18px;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 6px; height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">Doc<span>Mind</span></div>
  <div>
    <div class="sidebar-label" style="margin-bottom:12px;">Upload Documents</div>
    <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
      <div class="upload-icon">📄</div>
      <p><strong>Click to upload</strong><br/>PDF or TXT files</p>
    </div>
    <input type="file" id="file-input" accept=".pdf,.txt" multiple/>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:8px; overflow:hidden;">
    <div class="sidebar-label">Loaded Documents</div>
    <div class="doc-list" id="doc-list">
      <p style="font-size:12px; color:var(--muted);">No documents yet</p>
    </div>
  </div>
  <button class="clear-btn" onclick="clearAll()">🗑 Clear All</button>
</aside>

<main class="main">
  <div class="chat-header">
    <div class="status-dot"></div>
    <div>
      <h1>Ask Your Documents</h1>
      <p>Upload a PDF or TXT, then ask anything about it</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <div class="icon">🧠</div>
      <p>Upload a document from the sidebar, then ask questions about its content.</p>
    </div>
  </div>

  <div class="input-area">
    <textarea id="user-input" placeholder="Ask a question about your documents..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
      oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  let docs = [];
  let isFirstMessage = true;

  // Drag and drop
  const uploadArea = document.getElementById('upload-area');
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  document.getElementById('file-input').addEventListener('change', e => handleFiles(e.target.files));

  async function handleFiles(files) {
    for (const file of files) {
      const formData = new FormData();
      formData.append('file', file);
      showToast(`Uploading ${file.name}...`);
      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          docs.push(data.filename);
          updateDocList();
          showToast(`✓ ${data.filename} loaded (${data.chunks} chunks)`);
        } else {
          showToast(`Error: ${data.error}`);
        }
      } catch (e) {
        showToast('Upload failed');
      }
    }
  }

  function updateDocList() {
    const list = document.getElementById('doc-list');
    if (docs.length === 0) {
      list.innerHTML = '<p style="font-size:12px;color:var(--muted)">No documents yet</p>';
      return;
    }
    list.innerHTML = docs.map(d => `
      <div class="doc-item">
        <div class="dot"></div>
        ${d.length > 25 ? d.substring(0,25)+'...' : d}
      </div>`).join('');
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const msg = input.value.trim();
    if (!msg) return;

    if (isFirstMessage) {
      document.getElementById('empty-state')?.remove();
      isFirstMessage = false;
    }

    appendMessage('user', msg);
    input.value = '';
    input.style.height = 'auto';

    const typingId = appendTyping();
    document.getElementById('send-btn').disabled = true;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      removeTyping(typingId);
      if (!res.ok) {
        appendMessage('bot', data.error || `Request failed (${res.status}). Please try again.`);
      } else {
        appendMessage('bot', data.response || data.error || 'No response received.');
      }
    } catch (e) {
      removeTyping(typingId);
      appendMessage('bot', 'Could not reach the server. Is the app still running?');
    }
    document.getElementById('send-btn').disabled = false;
  }

  function appendMessage(role, text) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${text.replace(/\n/g,'<br/>')}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function appendTyping() {
    const messages = document.getElementById('messages');
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = id;
    div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    document.getElementById(id)?.remove();
  }

  async function clearAll() {
    await fetch('/clear', { method: 'POST' });
    docs = [];
    updateDocList();
    isFirstMessage = true;
    const messages = document.getElementById('messages');
    messages.innerHTML = `<div class="empty-state" id="empty-state"><div class="icon">🧠</div><p>Upload a document from the sidebar, then ask questions about its content.</p></div>`;
    showToast('Cleared');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
